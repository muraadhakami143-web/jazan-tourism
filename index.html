<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- تحسينات محركات البحث (SEO) لجعل الموقع يظهر باحترافية في قوقل -->
    <title>منصة سياحة جازان - حجز الرحلات السياحية</title>
    <meta name="description" content="احجز رحلتك السياحية القادمة في جزر وجبال جازان بكل سهولة ويسر. استكشف أجمل الوجهات السياحية وسجل حجوزاتك الفورية معنا.">
    <meta name="keywords" content="سياحة جازان, حجز رحلات, جازان, جزر جازان, وجهات سياحية, رحلات ترفيهية">
    
    <!-- تنسيق الصفحة -->
    <style>
        body {
            font-family: 'Cairo', Tahoma, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo-container img {
            max-width: 150px;
            height: auto;
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .booking-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            text-align: center;
            color: #0077b6;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #fff;
        }
        button {
            width: 100%;
            background-color: #28a745;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #218838;
        }
        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- قسم الشعار -->
    <div class="logo-container">
        <img src="logo.jpg" alt="شعار منصة سياحة جازان">
    </div>

    <div class="booking-card">
        <h2>حجز رحلة سياحية في جازان 🌴</h2>
        
        <form id="bookingForm">
            <div class="form-group">
                <label for="trip_id">اختر الرحلة:</label>
                <select id="trip_id" required onchange="updateTotal()">
                    <option value="" disabled selected>-- اختر الرحلة السياحية --</option>
                    <option value="1" data-price="300">الرحلة الأولى (300 ريال)</option>
                    <option value="2" data-price="400">الرحلة الثانية (400 ريال)</option>
                    <option value="3" data-price="500">الرحلة الثالثة (500 ريال)</option>
                    <option value="4" data-price="600">الرحلة الرابعة (600 ريال)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>اسم العميل:</label>
                <input type="text" id="customer_name" required>
            </div>
            
            <div class="form-group">
                <label>رقم الجوال:</label>
                <input type="text" id="customer_phone" required>
            </div>
            
            <div class="form-group">
                <label>عدد الأشخاص:</label>
                <input type="number" id="slots_booked" value="1" min="1" required oninput="updateTotal()">
            </div>
            
            <div class="form-group">
                <label>الإجمالي (ريال):</label>
                <input type="number" id="total_price" readonly required>
            </div>

            <button type="submit">تأكيد الحجز</button>
        </form>
        
        <p id="message"></p>
    </div>

    <script>
        // دالة لحساب وتحديث الإجمالي تلقائياً
        function updateTotal() {
            const tripSelect = document.getElementById('trip_id');
            const selectedOption = tripSelect.options[tripSelect.selectedIndex];
            const pricePerTicket = parseFloat(selectedOption.getAttribute('data-price')) || 0;
            
            const slotsInput = document.getElementById('slots_booked');
            const slots = parseInt(slotsInput.value) || 1;
            
            const total = pricePerTicket * slots;
            
            const totalInput = document.getElementById('total_price');
            totalInput.value = total;
        }

        document.getElementById('bookingForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const data = {
                trip_id: document.getElementById('trip_id').value,
                customer_name: document.getElementById('customer_name').value,
                customer_phone: document.getElementById('customer_phone').value,
                slots_booked: document.getElementById('slots_booked').value,
                total_price: document.getElementById('total_price').value,
                payment_status: 'Paid'
            };

            try {
                const response = await fetch('/api/book', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                const msgElement = document.getElementById('message');
                
                if (result.success) {
                    msgElement.style.color = 'green';
                    msgElement.textContent = `تم الحجز بنجاح! رقم الحجز: ${result.booking_id}`;
                } else {
                    msgElement.style.color = 'red';
                    msgElement.textContent = 'حدث خطأ أثناء الحجز، حاول مرة أخرى.';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('message').style.color = 'red';
                document.getElementById('message').textContent = 'تعذر الاتصال بالسيرفر.';
            }
        });
    </script>
</body>
</html>
